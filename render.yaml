services:
  - type: web
    name: arch-intel-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      # Backend CORS policy (Program.cs) reads Cors:AllowedOrigins from config; ASP.NET Core maps
      # Cors__AllowedOrigins__0 to Cors:AllowedOrigins[0]. This is the actual stable production
      # alias Vercel assigns the project (confirmed via `vercel projects ls` — the org/project-name
      # style domain used earlier turned out to be SSO-protected and NOT what the live app serves
      # from), not a per-deployment preview URL, which changes on every push.
      - key: Cors__AllowedOrigins__0
        value: https://arch-intel-psi.vercel.app
